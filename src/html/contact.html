<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="container contact-inner">
    <h2 class="contact__title" id="contact-title">Получите консультацию специалиста</h2>
    <p class="contact__subtitle">по недвижимости в Дубае</p>
    <form class="lead-form lead-form--contact" data-lead-form>
      <div class="lead-form__fields">
        <label class="visually-hidden" for="contact-name">Имя</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Имя" required maxlength="100">
        <label class="visually-hidden" for="contact-phone">Номер телефона</label>
        <input id="contact-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Номер телефона" required maxlength="40">
      </div>
      <button class="button button--yellow" type="submit">Отправить</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
