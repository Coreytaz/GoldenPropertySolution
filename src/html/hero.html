<section class="hero" aria-labelledby="hero-title">
  <div class="container hero__grid">
    <div class="hero__content">
      <h1 class="hero-title" id="hero-title">НЕДВИЖИМОСТЬ</h1>
      <p class="hero__region">в Объединенных Арабских Эмиратах</p>
      <div class="hero__rule" aria-hidden="true"></div>
      <p class="hero__highlight">Лучшая инвестиция!</p>
      <p class="hero__description">Компания <strong>Golden Property Soulution</strong> предлагает подбор и продажу инвестиционной недвижимости <strong>В РАССРОЧКУ НА 3-5 ЛЕТ!</strong></p>
    </div>
    <div class="hero__consultation">
      <h2 class="hero__form-title">Получите</h2>
      <p class="hero__form-subtitle">консультацию специалиста</p>
      <p class="hero__form-location">По недвижимости в Дубае</p>
      <form class="lead-form lead-form--hero" data-lead-form>
        <div class="lead-form__fields">
          <label class="visually-hidden" for="hero-name">Введите имя</label>
          <input id="hero-name" name="name" type="text" autocomplete="name" placeholder="Введите имя" required maxlength="100">
          <label class="visually-hidden" for="hero-phone">Введите телефон</label>
          <input id="hero-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Введите телефон" required maxlength="40">
        </div>
        <button class="button button--dark" type="submit">Получить консультацию</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
